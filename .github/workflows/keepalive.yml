name: Supabase keep-alive

# Pings the Supabase project on a schedule so the free-tier project does not
# pause after ~7 days of inactivity (e.g. in the off-season).
#
# No secrets needed: both the project URL and the anon key are public (they ship
# in the deployed app's JavaScript). RLS protects the data, not the key. The
# endpoint requires the apikey header, so it is included below.
#
# Caveat: GitHub disables scheduled workflows after ~60 days with no repo
# activity. For long dormancy, an external pinger (e.g. cron-job.org) hitting
# the same URL is more reliable.

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0YnBrb3p4Y2prYXhtZWxuZXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MjUwOTQsImV4cCI6MjA5NzAwMTA5NH0.pl2h4yHVcgz1855nF8lfyQtGRwBCdjw9z8ocrRh4nZw" "https://atbpkozxcjkaxmelnext.supabase.co/auth/v1/health" -o /dev/null
          echo "Pinged Supabase to keep the project active."
