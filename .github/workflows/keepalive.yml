name: Supabase keep-alive

# Pings the Supabase project on a schedule so the free-tier project does not
# pause after ~7 days of inactivity (e.g. in the off-season).
#
# No secrets needed: the project URL is public (it ships in the deployed app),
# and the GoTrue /health endpoint returns 200 without any key. The request
# reaches the project, which is what keeps it active.
#
# Caveat: GitHub disables scheduled workflows after ~60 days with no repo
# activity. For very long dormancy, an external pinger (e.g. cron-job.org)
# hitting the same URL is more reliable.

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://atbpkozxcjkaxmelnext.supabase.co/auth/v1/health" -o /dev/null
          echo "Pinged Supabase to keep the project active."
