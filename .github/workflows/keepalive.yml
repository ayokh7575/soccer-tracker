name: Supabase keep-alive

# Pings the Supabase project on a schedule so the free-tier project does not
# pause after ~7 days of inactivity (e.g. in the off-season).
#
# Setup: add two repo secrets under
#   Settings → Secrets and variables → Actions:
#     SUPABASE_URL       e.g. https://YOUR-REF.supabase.co
#     SUPABASE_ANON_KEY  the public anon key (safe to store)
#
# Caveat: GitHub disables scheduled workflows after ~60 days with no repo
# activity. For very long dormancy, an external pinger (e.g. cron-job.org)
# hitting the same URL is more reliable.

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "Pinged Supabase to keep the project active."
